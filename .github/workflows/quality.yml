name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|token[^/]*\.json|client_secrets\.json|keys\.json)$'; then
            echo "Tracked runtime secret file detected" >&2
            exit 1
          fi
      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint checks
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q shorts_pipeline tests scripts

      - name: Check shell helpers
        run: for script in scripts/*.sh; do sh -n "$script"; done

      - name: Run tests
        run: python -m pytest -q
