[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "Pillow>=11,<13",
]

[project.scripts]
shorts-pipeline = "shorts_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
